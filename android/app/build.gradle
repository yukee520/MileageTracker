apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.0'
        force 'androidx.core:core-ktx:1.13.0'
        force 'androidx.appcompat:appcompat:1.6.1'
    }
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

def safeExec(cmd, defaultPath) {
    try {
        def res = cmd.execute(null, rootDir).text.trim()
        if (res && !res.isEmpty()) return res
    } catch (Exception e) {}
    return defaultPath
}

def reactNativePath = safeExec(["node", "--print", "require.resolve('react-native/package.json')", "--cwd", projectRoot], "${projectRoot}/node_modules/react-native")
def entryFilePath = safeExec(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot], "${projectRoot}/index.js")
def codegenPath = safeExec(["node", "--print", "require.resolve('@react-native/codegen/package.json')", "--cwd", projectRoot], "${projectRoot}/node_modules/@react-native/codegen")
def cliFilePath = safeExec(["node", "--print", "require.resolve('@expo/cli', { paths: ['" + projectRoot + "'] })"], "${projectRoot}/node_modules/@expo/cli")

react {
    entryFile = file(entryFilePath)
    reactNativeDir = file(reactNativePath)
    hermesCommand = "${reactNativePath}/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = file(codegenPath)
    cliFile = file(cliFilePath)
    bundleCommand = "export:embed"
    autolinkLibrariesWithApp()
}

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: 'false').toBoolean()
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk 35

    namespace 'com.yukee.MileageTracker'
    defaultConfig {
        applicationId 'com.yukee.MileageTracker'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('REACT_NATIVE_RELEASE_LEVEL') ?: 'debug'}\""
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            def enableShrinkResources = findProperty('android.enableShrinkResources') ?: 'false'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInRelease') ?: 'false'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }

    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }

    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",")
    options = options.collect { it.trim() }.findAll { !it.isEmpty() }

    if (options.size() > 0) { // Changed from options.length
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}


dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
