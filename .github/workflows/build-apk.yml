name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Accept Android SDK licenses
        run: |
          mkdir -p /home/runner/.android
          echo -e "\ncount=0\ndisplayed=0\n" > /home/runner/.android/repositories.cfg
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Generate Android folder
        run: npx expo prebuild --platform android --clean --non-interactive
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MileageTracker-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
