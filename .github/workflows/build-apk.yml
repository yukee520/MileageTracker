name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Clean workspace & purge C++ caches
        run: |
          rm -rf node_modules
          find . -type d \( -name ".cxx" -o -name "build" -o -name ".gradle" \) -exec rm -rf {} + 2>/dev/null || true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Export Expo Bundle
        run: npx expo export --platform android

      - name: Copy bundle to assets
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/_expo/static/js/android/*.js android/app/src/main/assets/index.android.bundle
          cp -r dist/assets/* android/app/src/main/res/ 2>/dev/null || true

      - name: Build APK with Gradle
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-build-cache
          ./gradlew assembleRelease \
            -Pandroid.ndkPath=/usr/local/lib/android/sdk/ndk/25.2.9519653 \
            --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MileageTracker-APK
          path: android/app/build/outputs/apk/release/*.apk
