name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      
      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Set environment to disable Hermes
        run: |
          echo "EXPO_USE_HERMES=false" >> $GITHUB_ENV
          echo "hermesEnabled=false" >> $GITHUB_ENV
      
      - name: Build APK
        env:
          EXPO_USE_HERMES: false
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PhermesEnabled=false
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MileageTracker-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
