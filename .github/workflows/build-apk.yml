name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Purge cached Termux build artifacts
        run: |
          find . -type d -name ".cxx" -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "build" -exec rm -rf {} + 2>/dev/null || true

      - name: Export Expo Bundle
        run: npx expo export --platform android

      - name: Copy bundle to assets
        run: |
          mkdir -p android/app/src/main/assets
          cp dist/_expo/static/js/android/*.js android/app/src/main/assets/index.android.bundle
          cp -r dist/assets/* android/app/src/main/res/ 2>/dev/null || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --rerun-tasks --no-build-cache

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MileageTracker-APK
          path: android/app/build/outputs/apk/release/*.apk
